<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anti Comment Buster</title>
  <meta name="description" content="アンチコメントに言い返す欲求を叶える、レスバ・シミュレーションゲーム" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%231d9bf0' d='M32 6c15 0 26 9.6 26 22S47 50 32 50c-3 0-5.8-.4-8.4-1.1L12 56l2.6-10.4C9.3 41.7 6 35.2 6 28 6 15.6 17 6 32 6z'/%3E%3Cpath fill='%23ffd23f' d='M35 13L22 31h9l-4 15 14-19h-9z'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AC Buster" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="stylesheet" href="style.css?v=20261014e" />
</head>
<body>
  <div id="app">
    <!-- ===== スタート画面 ===== -->
    <section id="setup" class="screen active">
      <div class="setup-top">
        <button class="icon-btn settings-btn" type="button" aria-label="設定" data-icon="gear"></button>
      </div>
      <header class="setup-hero">
        <div class="logo" data-icon="logo"></div>
        <h1>Anti Comment<br /><span>Buster</span></h1>
      </header>

      <div class="card">
        <h2>相手</h2>
        <div id="levels" class="levels"></div>
        <p id="levelDesc" class="level-desc"></p>
      </div>

      <button id="startBtn" class="primary big" type="button">スタート</button>
    </section>

    <!-- ===== ゲーム画面 ===== -->
    <section id="game" class="screen">
      <header class="topbar">
        <button id="backBtn" class="icon-btn" type="button" aria-label="戻る" data-icon="back"></button>
        <div class="brand">Chirpy</div>
        <div class="meta"><span id="levelBadge" class="badge"></span></div>
        <button class="icon-btn settings-btn" type="button" aria-label="設定" data-icon="gear"></button>
      </header>

      <div class="gauge-wrap">
        <div class="gauge-labels"><span>言い負け</span><span>論破ゲージ</span><span>論破</span></div>
        <div class="gauge">
          <div id="gaugeFill" class="gauge-fill"></div>
          <div class="gauge-center"></div>
          <div id="gaugeKnob" class="gauge-knob" data-icon="swords"></div>
        </div>
        <div id="combo" class="combo"></div>
      </div>

      <main id="feed" class="feed"></main>

      <form id="composer" class="composer">
        <textarea id="replyInput" rows="2" maxlength="280" placeholder="言い返してやれ…"></textarea>
        <div class="composer-actions">
          <button id="giveUpBtn" class="ghost small" type="button">降参</button>
          <span id="charCount" class="char-count">0/280</span>
          <button id="sendBtn" class="primary" type="submit">返信</button>
        </div>
      </form>
    </section>
  </div>

  <!-- 演出レイヤー -->
  <div id="flash" class="flash"></div>
  <div id="fx" class="fx" aria-live="polite"></div>

  <!-- 設定モーダル -->
  <div id="settings" class="modal" hidden>
    <div class="modal-body settings-body">
      <h2>設定</h2>
      <label class="field">
        <span>Gemini APIキー <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">無料で取得</a></span>
        <div class="row">
          <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false" />
          <button id="toggleKey" class="ghost small" type="button">表示</button>
        </div>
      </label>
      <label class="field">
        <span>モデル</span>
        <input id="model" list="modelList" placeholder="自動（おすすめ）" spellcheck="false" />
        <datalist id="modelList">
          <option value="gemini-flash-latest"></option>
          <option value="gemini-flash-lite-latest"></option>
          <option value="gemini-2.5-flash"></option>
          <option value="gemini-2.5-flash-lite"></option>
        </datalist>
      </label>
      <div class="field inline">
        <span>効果音</span>
        <label class="switch"><input id="soundToggle" type="checkbox" checked /><span></span></label>
      </div>
      <p id="settingsStatus" class="status" role="status"></p>
      <div class="settings-actions">
        <button id="testKeyBtn" class="ghost" type="button">接続テスト</button>
        <button id="settingsClose" class="primary" type="button">保存</button>
      </div>
      <p class="hint center">キーはこの端末にだけ保存されます</p>
    </div>
  </div>

  <!-- 結果モーダル -->
  <div id="result" class="modal" hidden>
    <div id="resultCard" class="modal-body result-card">
      <div class="result-hero">
        <div id="resultLabel" class="result-label"></div>
        <div id="resultTitle" class="result-title"></div>
        <div class="versus">
          <div id="resultMe" class="vs-avatar"></div>
          <span class="vs-text">VS</span>
          <div id="resultFoe" class="vs-avatar"></div>
        </div>
        <p id="resultSub" class="result-sub"></p>
      </div>
      <div class="rank-row">
        <div id="rank" class="rank"><small>RANK</small><b id="rankLetter"></b></div>
        <div class="stats">
          <div><b id="statRally">0</b><small>ラリー</small></div>
          <div><b id="statNice">0</b><small>NICE</small></div>
          <div><b id="statBest">0</b><small>最高点</small></div>
        </div>
      </div>
      <div id="rallyChart" class="rally-chart" aria-label="ラリーごとの点数"></div>
      <div id="bestReply" class="best-reply"></div>
      <div class="result-actions">
        <button id="retryBtn" class="primary" type="button">もう一度</button>
        <button id="shareBtn" class="icon-round" type="button" aria-label="結果をポスト" data-icon="share"></button>
        <button id="toSetupBtn" class="icon-round" type="button" aria-label="トップに戻る" data-icon="home"></button>
      </div>
    </div>
  </div>

  <script src="icons.js?v=20261014e"></script>
  <script src="app.js?v=20261014e"></script>
</body>
</html>
